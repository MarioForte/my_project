<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechShop - Магазин электроники{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .product-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .product-card:hover{
            transform: translateY(-5px);
        }
        .footer {
            background-color: whitesmoke;
            padding: 2rem 0;
            margin-top: 3rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a href="{% url 'home' %}" class="navbar-brand">TechShop</a>
            <div class="navbar-nav me-auto">
                <a href="{% url 'home' %}" class="nav-link">На главную</a>
                <a href="{% url 'product_list' %}" class="nav-link">Все товары</a>
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">
                        Категории
                    </a>
                    <ul class="dropdown-menu">
                        {% for category in categories %}
                        <li>
                            <a href="{% url 'category_products' category.id %}" class="dropdown-item">
                                {{ category.name }}
                            </a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
            <div class="navbar-nav">
                <a href="/admin/" class="nav-link">Админ-панель</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}
        
        {% endblock %}
    </main>

    <footer class="footer mt-5">
        <div class="container text-center">
            <p>&copy; 2026 TechShop. Все права бла-бла-бла</p>
            <p class="text-muted">Интернет-магазин электроники</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
